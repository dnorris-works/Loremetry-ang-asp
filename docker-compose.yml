services:
  postgres:
    image: postgres:17
    container_name: loremetry-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loremetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loremetry}
      POSTGRES_DB: ${POSTGRES_DB:-loremetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loremetry} -d ${POSTGRES_DB:-loremetry}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
