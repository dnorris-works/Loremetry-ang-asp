<div class="markdown-editor">
  <div class="markdown-editor__toolbar" role="toolbar" aria-label="Formatting">
    <div class="markdown-editor__toolbar-group markdown-editor__view-toggle" role="group" aria-label="Editor view">
      <button
        type="button"
        class="markdown-editor__toolbar-button"
        [class.markdown-editor__toolbar-button--active]="viewMode() === 'wysiwyg'"
        aria-label="Visual editor"
        title="Visual editor"
        (click)="setViewMode('wysiwyg')"
      >
        <span class="markdown-editor__toolbar-icon" aria-hidden="true">Visual</span>
      </button>
      <button
        type="button"
        class="markdown-editor__toolbar-button"
        [class.markdown-editor__toolbar-button--active]="viewMode() === 'code'"
        aria-label="Markdown code view"
        title="Markdown code view"
        (click)="setViewMode('code')"
      >
        <span class="markdown-editor__toolbar-icon" aria-hidden="true">Code</span>
      </button>
    </div>

    @for (group of toolbarGroups; track group.items[0].action) {
      <div class="markdown-editor__toolbar-group">
        @for (item of group.items; track item.action) {
          <button
            type="button"
            class="markdown-editor__toolbar-button"
            [attr.aria-label]="item.label"
            [title]="item.label"
            (click)="applyFormat(item.action)"
          >
            <span class="markdown-editor__toolbar-icon" aria-hidden="true">{{ item.icon }}</span>
          </button>
        }
      </div>
    }
  </div>

  <div class="markdown-editor__body">
    <div
      class="markdown-editor__pane markdown-editor__pane--visual"
      [class.markdown-editor__pane--hidden]="viewMode() !== 'wysiwyg'"
      [attr.aria-hidden]="viewMode() !== 'wysiwyg'"
    >
      <div tiptapEditor [editor]="editor" class="markdown-editor__tiptap-host"></div>
    </div>

    <div
      class="markdown-editor__pane markdown-editor__pane--code"
      [class.markdown-editor__pane--hidden]="viewMode() !== 'code'"
      [attr.aria-hidden]="viewMode() !== 'code'"
    >
      <textarea
        #textarea
        class="markdown-editor__textarea"
        aria-label="Markdown content"
        placeholder="Start writing…"
        (input)="onCodeInput($event)"
      ></textarea>
    </div>
  </div>

  <footer class="markdown-editor__footer">
    <span class="markdown-editor__meta">{{ markdown().length }} characters</span>
    <span class="markdown-editor__meta">
      {{ viewMode() === 'wysiwyg' ? 'Visual · Markdown output' : 'Markdown code view' }}
    </span>
  </footer>
</div>
