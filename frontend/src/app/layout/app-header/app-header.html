<header class="app-header theme-surface-header">
  <div class="app-header__brand">
    <a routerLink="/" class="app-header__logo theme-heading">{{ appName }}</a>
  </div>

  <nav class="app-header__nav" aria-label="Main navigation">
    <ul class="app-header__nav-list">
      @for (item of navItems(); track item.route) {
        <li>
          <a
            class="app-header__nav-link"
            [routerLink]="item.route"
            [class.app-header__nav-link--active]="isRouteNavActive(item.route)"
            [attr.aria-current]="isRouteNavActive(item.route) ? 'page' : null"
          >
            {{ item.label }}
          </a>
        </li>
      }
      <li>
        <button
          type="button"
          class="app-header__nav-link app-header__nav-button"
          [class.app-header__nav-link--active]="isWriteMenuActive()"
          [disabled]="isWriteMenuDisabled()"
          [attr.aria-disabled]="isWriteMenuDisabled()"
          [attr.aria-current]="isWriteMenuActive() ? 'page' : null"
          (click)="openWritingPanel()"
        >
          Write
        </button>
      </li>
    </ul>
  </nav>

  <div class="app-header__actions">
    @if (userLabel()) {
      <span class="app-header__user" [attr.title]="auth.me()?.email ?? ''">{{ userLabel() }}</span>
    }
    <button type="button" class="app-header__sign-out" (click)="onSignOut()">
      Sign out
    </button>
  </div>
</header>
