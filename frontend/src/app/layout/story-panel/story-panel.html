<section class="story-panel" aria-labelledby="story-panel-title">
  <header class="story-panel__header">
    <div>
      <h2 id="story-panel-title" class="story-panel__title">New story</h2>
      <p class="story-panel__subtitle">Add a story and link its manuscript and bible files.</p>
    </div>

    <button type="button" class="story-panel__close" aria-label="Close story panel" (click)="close()">
      &times;
    </button>
  </header>

  @if (errorMessage()) {
    <p class="story-panel__error" role="alert">{{ errorMessage() }}</p>
  }

  <form class="story-panel__form" (submit)="$event.preventDefault(); save()">
    <label class="story-panel__field">
      <span class="story-panel__field-label">Story name</span>
      <input
        class="story-panel__input"
        type="text"
        name="storyName"
        autocomplete="off"
        placeholder="Enter a story name"
        [value]="storyName()"
        (input)="onStoryNameInput($event)"
      />
    </label>

    <app-story-file-picker
      label="Manuscript / chapters"
      description="Choose one or more manuscript files (.md, .txt, or .docx), or add from recent files."
      listTitle="Manuscript files"
      pickerTypeLabel="Manuscript files"
      [options]="recentManuscriptFiles()"
      [value]="manuscriptFiles()"
      (valueChange)="onManuscriptFilesChange($event)"
      (browseError)="onBrowseError($event)"
    />

    <app-story-file-picker
      label="Bible files"
      description="Choose one or more bible files (.md, .txt, or .docx), or add from recent files."
      listTitle="Bible files"
      pickerTypeLabel="Bible files"
      [options]="recentBibleFiles()"
      [value]="bibleFiles()"
      (valueChange)="onBibleFilesChange($event)"
      (browseError)="onBrowseError($event)"
    />

    <div class="story-panel__actions">
      <button type="button" class="story-panel__button story-panel__button--ghost" (click)="close()">
        Cancel
      </button>
      <button type="submit" class="story-panel__button">Save story</button>
    </div>
  </form>
</section>
