<section
  class="writing-panel"
  [class.writing-panel--resizing]="isResizing()"
  aria-labelledby="writing-panel-title"
>
  <header class="writing-panel__header">
    <div>
      <h2 id="writing-panel-title" class="writing-panel__title theme-heading">
        {{ headerTitle() }}
      </h2>
      <p class="writing-panel__subtitle">{{ subtitle() }}</p>
    </div>

    <div class="writing-panel__header-actions">
      @if (isDocumentMode()) {
        <button
          type="button"
          class="writing-panel__button"
          [disabled]="isSaving() || !isDirty()"
          (click)="save()"
        >
          {{ isSaving() ? 'Saving…' : 'Save' }}
        </button>
      }

      <button type="button" class="writing-panel__close" aria-label="Close writing panel" (click)="close()">
        &times;
      </button>
    </div>
  </header>

  @if (saveError()) {
    <p class="writing-panel__error" role="alert">{{ saveError() }}</p>
  }

  <div class="writing-panel__workspace">
    <div class="writing-panel__editor-pane">
      <div class="writing-panel__form">
        <div
          class="writing-panel__title-row"
          [class.writing-panel__title-row--locked]="isDocumentMode()"
        >
          @if (isDocumentMode()) {
            <div class="writing-panel__field writing-panel__field--destination">
              <span class="writing-panel__field-label">Destination</span>
              <p class="writing-panel__readonly-value" aria-readonly="true">
                {{ destinationDisplayName() }}
              </p>
            </div>

            <div class="writing-panel__field writing-panel__field--type">
              <span class="writing-panel__field-label">Type</span>
              <p class="writing-panel__readonly-value" aria-readonly="true">
                {{ documentTypeDisplayName() }}
              </p>
            </div>
          } @else {
            <label class="writing-panel__field writing-panel__field--title">
              <span class="writing-panel__field-label">Title</span>
              <input
                class="writing-panel__input"
                type="text"
                name="writingTitle"
                autocomplete="off"
                placeholder="Optional title"
                [value]="title()"
                (input)="onTitleInput($event)"
              />
            </label>

            <label class="writing-panel__field writing-panel__field--destination">
              <span class="writing-panel__field-label">Destination</span>
              <select
                class="writing-panel__select"
                name="writingDestination"
                [value]="destinationKey()"
                [disabled]="!hasDestinations()"
                (change)="onDestinationChange($event)"
              >
                @if (!hasDestinations()) {
                  <option value="">No stories or series</option>
                }

                @if (destinationSeries().length > 0) {
                  <optgroup label="Series">
                    @for (series of destinationSeries(); track series.id) {
                      <option [value]="destinationOptionValue('series', series.id)">
                        {{ series.name }}
                      </option>
                    }
                  </optgroup>
                }

                @if (destinationStories().length > 0) {
                  <optgroup label="Stories">
                    @for (story of destinationStories(); track story.id) {
                      <option [value]="destinationOptionValue('story', story.id)">
                        {{ story.name }}
                      </option>
                    }
                  </optgroup>
                }
              </select>
            </label>

            <label class="writing-panel__field writing-panel__field--type">
              <span class="writing-panel__field-label">Type</span>
              <select
                class="writing-panel__select"
                name="writingDocumentType"
                [value]="documentTypeCode()"
                [disabled]="!destinationKey()"
                (change)="onDocumentTypeChange($event)"
              >
                @for (type of documentTypes(); track type.code) {
                  <option [value]="type.code">{{ type.displayName }}</option>
                }
              </select>
            </label>
          }
        </div>

        <app-markdown-editor
          class="writing-panel__editor"
          [markdown]="content()"
          (markdownChange)="onContentChange($event)"
        />
      </div>
    </div>

    <div
      class="writing-panel__split-handle"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize assistant panel"
      aria-valuemin="240"
      aria-valuemax="560"
      [attr.aria-valuenow]="assistantWidth()"
      tabindex="0"
      (pointerdown)="onSplitPointerDown($event)"
      (keydown)="onSplitKeyDown($event)"
    ></div>

    <div class="writing-panel__assistant-pane" [style]="assistantPaneStyle()">
      <app-writing-assistant [documentTitle]="assistantDocumentTitle()" />
    </div>
  </div>
</section>
