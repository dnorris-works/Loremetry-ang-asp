<aside class="app-sidebar">
  <p class="app-sidebar__heading" id="sidebar-nav-label">Navigation</p>

  <nav class="app-sidebar__nav" aria-labelledby="sidebar-nav-label">
    <ul class="app-sidebar__list">
      @for (item of items(); track item.route) {
        <li>
          <a
            class="app-sidebar__link"
            [routerLink]="item.route"
            routerLinkActive="app-sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          >
            @if (item.icon) {
              <span class="app-sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
            }
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
